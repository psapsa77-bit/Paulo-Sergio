[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labor-termination-analyzer"
version = "1.0.0"
description = "Aplicativo para ler, analisar e explicar rescisões trabalhistas com geração de relatórios em PDF e HTML"
authors = [
    {name = "Paulo Sergio"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "jinja2>=3.1.2",
    "weasyprint>=60.0",
    "python-dateutil>=2.8.2",
    "reportlab>=4.0.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.scripts]
rescisao = "labor_termination_analyzer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
